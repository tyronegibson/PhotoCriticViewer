name: PhotoCriticViewer
options:
  bundleIdPrefix: com.photocritic
  createIntermediateGroups: true
  xcodeVersion: "16"

targets:
  PhotoCriticViewer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PhotoCriticViewer
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photocritic.viewer
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "PhotoCritic Local"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: PhotoCriticViewer/PhotoCriticViewer.entitlements
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: YL4WC3GC5U
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
